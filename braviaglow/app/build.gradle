plugins {
    id 'com.android.application'
}

android {
    namespace 'com.usman.braviaglow'
    compileSdk 35

    defaultConfig {
        applicationId 'com.usman.braviaglow'
        minSdk 23
        targetSdk 28
        versionCode 4
        versionName '0.4.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
