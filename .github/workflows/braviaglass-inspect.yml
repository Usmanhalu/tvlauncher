name: BraviaGlass source diagnostics
on:
  push:
    paths: ['.github/workflows/braviaglass-inspect.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and inspect non-secret launcher sources
        env:
          PYTHONIOENCODING: utf-8
        run: |
          set -euo pipefail
          mkdir -p /tmp/bravia
          unzip -q BraviaGlass-public-source.zip -d /tmp/bravia
          python3 scripts/patch_braviaglass_1_3_2.py /tmp/bravia/BraviaGlass
          python3 scripts/patch_braviaglass_1_3_3.py /tmp/bravia/BraviaGlass
          python3 - <<'PY'
          import base64,zlib,pathlib,os,hashlib
          for v in ['1_3_4','1_3_5']:
              src=pathlib.Path(f'scripts/patch_braviaglass_{v}.py.zlib.b64').read_text().strip()
              code=zlib.decompress(base64.b64decode(src))
              path=pathlib.Path(f'/tmp/patch_{v}.py')
              path.write_bytes(code)
              print(f'PATCH {v} SHA256: {hashlib.sha256(code).hexdigest()}')
          PY
          python3 /tmp/patch_1_3_4.py /tmp/bravia/BraviaGlass
          python3 /tmp/patch_1_3_5.py /tmp/bravia/BraviaGlass
          python3 - <<'PY'
          import pathlib,re
          root=pathlib.Path('/tmp/bravia/BraviaGlass/app/src/main/java/com/usman/braviaglass')
          words=['sources','input','hdmi','quick','timer','setting','weather','clock','greet','morning','day','date','приложен','источни','доброе','облачно','onKey','onClick','launchTvTimer','selected']
          for f in root.glob('*.java'):
              lines=f.read_text(errors='replace').splitlines()
              hits=[(i,x) for i,x in enumerate(lines) if any(w.lower() in x.lower() for w in words)]
              if not hits:continue
              print(f'\\n===== {f.name}: {len(lines)} lines; {len(hits)} matches =====')
              if f.name in ('GlassView.java','ScenicHome.java','ColorHome.java'):
                  wanted=set()
                  for i,line in hits:
                      for j in range(max(0,i-3),min(len(lines),i+4)):wanted.add(j)
                  if len(wanted)>600:
                      needles=('source','input','hdmi','quick','timer','setting','weather','clock','greet','day','date','источни','доброе','onkey','onclick','launchTvTimer')
                      wanted=set()
                      for i,line in hits:
                          if any(q in line.lower() for q in needles):
                              for j in range(max(0,i-3),min(len(lines),i+5)):wanted.add(j)
                  for j in sorted(wanted): print(f'{j+1:04}: {lines[j][:300]}')
          print('\\n===== MAIN ACTIVITY INPUTS / SETTINGS FULL METHODS =====')
          java=(root/'MainActivity.java').read_text().splitlines()
          for i,line in enumerate(java):
              if any(q in line for q in ['void inputs(', 'void systemSettings(', 'void openSystemSettings(', 'void control(', 'void tvSettings(', 'void settings(', 'void openInput', 'void sources(', 'void launchTv', 'void openTv']):
                  for j in range(max(0,i-10),min(len(java),i+65)):print(f'MainActivity:{j+1:04}: {java[j][:320]}')
          print('\\n===== COLORHOME HEADER + ACTION REFERENCES =====')
          lines=(root/'ColorHome.java').read_text().splitlines()
          for j in range(50,min(105,len(lines))):print(f'ColorHome:{j+1:04}: {lines[j][:340]}')
          print('\\n===== GLASSVIEW ACTIVATION 640-765 =====')
          lines=(root/'GlassView.java').read_text().splitlines()
          for j in range(639,min(765,len(lines))):print(f'GlassView:{j+1:04}: {lines[j][:340]}')
          print('\\n===== PATCH 1.3.5 (first 300 lines) =====')
          patch=pathlib.Path('/tmp/patch_1_3_5.py').read_text().splitlines()
          for i,line in enumerate(patch[:300]):print(f'{i+1:03}: {line[:350]}')
          PY
