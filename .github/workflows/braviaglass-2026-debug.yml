name: BraviaGlass 2026 v1.0.3 Weather & City TV APK
on:
  push:
    branches:
      - braviaglass-2026-v103
    paths:
      - 'braviaglass2026/**'
      - '.github/workflows/braviaglass-2026-debug.yml'
  workflow_dispatch:
jobs:
  android-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK 35 (preinstalled runner tools)
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          echo "SDK Manager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Reconstruct and verify v1.0.1 source archive
        shell: bash
        run: |
          mkdir -p braviaglass2026/workdir
          cat braviaglass2026/payload_0{1..7}.b64 | base64 -d > braviaglass2026/workdir/source.tar.xz
          cd braviaglass2026/workdir
          echo "5fe6e813a9a8b6b734db2375d8b731b0ccb26436d281122657e2ea88ff8af922  source.tar.xz" | sha256sum -c -
          tar -xJf source.tar.xz
          test -f app/src/main/java/com/braviaglass/tv/LauncherActivity.java
      - name: Apply verified BraviaGlass v1.0.3 source changes
        shell: bash
        run: |
          base64 -d braviaglass2026/overrides_v103.b64 > braviaglass2026/workdir/overrides.tar.xz
          cd braviaglass2026/workdir
          echo 'ebe029336f363f661fd13583a3279bf68e18f4d1cbe21680c2a0306ec4392929  overrides.tar.xz' | sha256sum -c -
          tar -xJf overrides.tar.xz
          grep -F "applicationId 'com.braviaglass.tv2026.v103'" app/build.gradle
          grep -F 'com.braviaglass.tv2026.v103.updates' app/src/main/AndroidManifest.xml
          grep -F '"Махачкала"' app/src/main/java/com/braviaglass/tv/LauncherActivity.java
      - name: Build APK
        working-directory: braviaglass2026/workdir
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK signing
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose braviaglass2026/workdir/app/build/outputs/apk/debug/app-debug.apk
      - name: Verify output APK
        run: |
          test -s braviaglass2026/workdir/app/build/outputs/apk/debug/app-debug.apk
          sha256sum braviaglass2026/workdir/app/build/outputs/apk/debug/app-debug.apk > braviaglass2026/workdir/BraviaGlass2026-v1.0.3-sha256.txt
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BraviaGlass2026-v1.0.3-debug
          path: |
            braviaglass2026/workdir/app/build/outputs/apk/debug/app-debug.apk
            braviaglass2026/workdir/BraviaGlass2026-v1.0.1-sha256.txt
          if-no-files-found: error
