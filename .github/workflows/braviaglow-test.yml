name: BraviaGlow TV companion test APK
on:
  push:
    branches:
      - braviaglow-addon
    paths:
      - 'braviaglow/**'
      - '.github/workflows/braviaglow-test.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK 35
        shell: bash
        run: |
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle --no-daemon -p braviaglow :app:assembleDebug
      - name: Verify APK and signature
        run: |
          APK=braviaglow/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK" > braviaglow/apk-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: BraviaGlow-v0.2-debug
          path: |
            braviaglow/app/build/outputs/apk/debug/app-debug.apk
            braviaglow/apk-sha256.txt
          if-no-files-found: error
