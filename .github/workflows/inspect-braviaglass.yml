name: Inspect BraviaGlass UI
on:
  push:
    paths:
      - '.github/workflows/inspect-braviaglass.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and apply patches (no signing keys)
        run: |
          set -euo pipefail
          unzip -q BraviaGlass-public-source.zip -d /tmp/src
          cd "$GITHUB_WORKSPACE"
          PROJECT=/tmp/src/BraviaGlass
          python3 scripts/patch_braviaglass_1_3_2.py "$PROJECT"
          python3 scripts/patch_braviaglass_1_3_3.py "$PROJECT"
          python3 - <<'PY'
          import base64,zlib,hashlib,pathlib
          for version in ('1_3_4','1_3_5'):
            s=pathlib.Path(f'scripts/patch_braviaglass_{version}.py.zlib.b64').read_text().strip()
            pathlib.Path(f'/tmp/patch_{version}.py').write_bytes(zlib.decompress(base64.b64decode(s)))
          PY
          python3 /tmp/patch_1_3_4.py "$PROJECT"
          python3 /tmp/patch_1_3_5.py "$PROJECT"
          python3 scripts/patch_braviaglass_1_3_6.py "$PROJECT"
      - name: Print only UI handlers and renderer sections
        run: |
          python3 - <<'PY'
          from pathlib import Path
          base=Path('/tmp/src/BraviaGlass/app/src/main/java/com/usman/braviaglass')
          patterns={
            'MainActivity.java':['void choice(', 'void wifi(', 'void timer(', 'void inputs(', 'void tvSettings(', 'void system(', 'void update(', 'void screensaver(', 'new AlertDialog','AlertDialog.Builder'],
            'GlassView.java':['enum Screen', 'enum', 'void draw(', 'void render(', 'void onKey', 'void key(', 'void open(', 'void notifyText(', 'void drawModal(', 'void choice(', 'void settings(', 'void openAddPicker(', 'void show', 'void source','void animate','void top','void input','void dialog','void setScreen','void display'],
            'ColorHome.java':['void draw(', 'void top', 'void topButton(', 'void onKey', 'void key(', 'void weather(', 'void handle'],
            'ScenicHome.java':['void draw(', 'void softHalo(', 'void top'],
          }
          for name,(a,b) in {'MainActivity.java':(1,94),'GlassView.java':(180,480),'ColorHome.java':(1,49)}.items():
            path=base/name
            lines=path.read_text().splitlines()
            print(f'========== TARGETED {name} L{a}-{b} ==========')
            for i in range(a-1,min(len(lines),b)):
              print(f'{i+1:04d}: {lines[i]}')
          for name,searches in patterns.items():
            path=base/name
            if not path.exists():continue
            lines=path.read_text().splitlines()
            print(f'========== {name} {len(lines)} lines ==========')
            matches=[i for i,l in enumerate(lines) if any(t in l for t in searches)]
            windows=[]
            for i in matches:
              start=max(0,i-12);end=min(len(lines),i+40)
              if windows and windows[-1][1]>=start: windows[-1]=(windows[-1][0],max(end,windows[-1][1]))
              else:windows.append((start,end))
            total=0
            for a,b in windows:
              if total>900:break
              print(f'----- {name} L{a+1}-{b} -----')
              for i in range(a,b):
                print(f'{i+1:04d}: {lines[i]}')
                total+=1
          PY
