name: Inspect BraviaGlass 1.3.9 layout
on:
  push:
    paths: ['.github/workflows/inspect-bravia-139.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract patched source and show rendered layout
        run: |
          set -euo pipefail
          unzip -q BraviaGlass-public-source.zip -d /tmp/bravia
          PROJ=/tmp/bravia/BraviaGlass
          python3 scripts/patch_braviaglass_1_3_2.py "$PROJ"
          python3 scripts/patch_braviaglass_1_3_3.py "$PROJ"
          python3 - <<'PY'
          import pathlib,base64,zlib
          for v in ('1_3_4','1_3_5'):
            s=pathlib.Path('scripts/patch_braviaglass_'+v+'.py.zlib.b64').read_text().strip()
            pathlib.Path('/tmp/p'+v+'.py').write_bytes(zlib.decompress(base64.b64decode(s)))
          PY
          python3 /tmp/p1_3_4.py "$PROJ"
          python3 /tmp/p1_3_5.py "$PROJ"
          python3 scripts/patch_braviaglass_1_3_6.py "$PROJ"
          python3 scripts/patch_braviaglass_1_3_7.py "$PROJ"
          python3 scripts/patch_braviaglass_1_3_8.py "$PROJ"
          python3 scripts/patch_braviaglass_1_3_9.py "$PROJ"
          python3 - <<'PY'
          from pathlib import Path
          d=Path('/tmp/bravia/BraviaGlass/app/src/main/java/com/usman/braviaglass')
          for file in ('ColorHome.java','GlassView.java'):
            lines=(d/file).read_text().splitlines()
            print('#########',file,len(lines),'#########')
            if file=='ColorHome.java':
              spans=[(0,len(lines))]
            else:
              spans=[(0,56),(130,195),(300,360),(525,720)]
            for a,b in spans:
              print('-------',file,a+1,b,'-------')
              for i in range(a,min(b,len(lines))):
                print(f'{i+1:04d} {lines[i]}')
          PY
