name: BraviaGlass — signed APK
# BraviaGlass v1.4.0 Dynamic World and Pet Companion - build/test before publication

on:
  push:
    branches: [main]
    paths:
      - 'BraviaGlass-public-source.zip'
      - '.github/workflows/braviaglass-apk.yml'
      - 'scripts/patch_braviaglass_1_3_2.py'
      - 'scripts/patch_braviaglass_1_3_3.py'
      - 'scripts/patch_braviaglass_1_3_4.py.zlib.b64'
      - 'scripts/patch_braviaglass_1_3_5.py.zlib.b64'
      - 'scripts/patch_braviaglass_1_3_6.py'
      - 'scripts/patch_braviaglass_1_3_7.py'
      - 'scripts/patch_braviaglass_1_3_8.py'
      - 'scripts/patch_braviaglass_1_3_9.py'
      - 'scripts/patch_braviaglass_1_3_10.py'
      - 'scripts/patch_braviaglass_1_4_0.py'
      - 'scripts/build_dynamic_scenes.py'
      - 'assets/sunset-premium-part*.b64'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish signed v1.4.0 APK as a GitHub Release (only after testing)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: braviaglass-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout public repository
        uses: actions/checkout@v4

      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: 'false'

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/.android/sdk}}"
          test -f "$SDK_ROOT/platforms/android-35/android.jar"
          test -x "$SDK_ROOT/build-tools/35.0.0/aapt2"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Extract public source archive
        shell: bash
        run: |
          set -euo pipefail
          test -f BraviaGlass-public-source.zip || { echo 'Upload BraviaGlass-public-source.zip to the repository root first'; exit 1; }
          if unzip -Z1 BraviaGlass-public-source.zip | grep -Ei '(^|/)signing/|\.(jks|keystore|p12)$'; then
            echo 'Refusing source archive containing a private signing key'
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/braviaglass"
          unzip -q BraviaGlass-public-source.zip -d "$RUNNER_TEMP/braviaglass"
          test -f "$RUNNER_TEMP/braviaglass/BraviaGlass/tools/build-native.py"
          test -f "$RUNNER_TEMP/braviaglass/BraviaGlass/app/build.gradle"
          echo "PROJECT_DIR=$RUNNER_TEMP/braviaglass/BraviaGlass" >> "$GITHUB_ENV"

      - name: Patch home navigation, updater and app dock (v1.3.6)
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch_braviaglass_1_3_2.py "$PROJECT_DIR"
          python3 scripts/patch_braviaglass_1_3_3.py "$PROJECT_DIR"
          python3 - <<'PY'
          import base64, zlib, hashlib, pathlib, os
          source = pathlib.Path("scripts/patch_braviaglass_1_3_4.py.zlib.b64").read_text().strip()
          assert hashlib.sha256(source.encode()).hexdigest() == "29edc472a07e335515b61e1dbb8b1241d301af8bc1f38818b4bdb200155cba52", "Unexpected patch data checksum"
          decoded = zlib.decompress(base64.b64decode(source))
          assert hashlib.sha256(decoded).hexdigest() == "dbe2f6c0eee11d33c21cd7e18280819694393a35856a37de1d122ce9510ca7ea", "Unexpected patch script checksum"
          pathlib.Path(os.environ["RUNNER_TEMP"], "patch_braviaglass_1_3_4.py").write_bytes(decoded)
          PY
          python3 "$RUNNER_TEMP/patch_braviaglass_1_3_4.py" "$PROJECT_DIR"
          grep -q 'openAddPicker' "$PROJECT_DIR/app/src/main/java/com/usman/braviaglass/GlassView.java"
          grep -q 'v.softHalo' "$PROJECT_DIR/app/src/main/java/com/usman/braviaglass/ScenicHome.java"
          ! grep -q 'if(down)open(Screen.APPS);' "$PROJECT_DIR/app/src/main/java/com/usman/braviaglass/GlassView.java"
          ! grep -q 'if(down)v.open(GlassView.Screen.APPS);' "$PROJECT_DIR/app/src/main/java/com/usman/braviaglass/ColorHome.java"
          grep -q "versionCode 15" "$PROJECT_DIR/app/build.gradle"
          grep -q "versionName '1.3.4'" "$PROJECT_DIR/app/build.gradle"

      - name: Apply BraviaGlass v1.3.6 fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, zlib, hashlib, pathlib, os
          source = pathlib.Path("scripts/patch_braviaglass_1_3_5.py.zlib.b64").read_text().strip()
          assert hashlib.sha256(source.encode()).hexdigest() == "acab9f72d304345aeb399dc91b34fe901bdfa2b9a98cd0926b6e7a7d7eae0385", "Unexpected patch data"
          decoded = zlib.decompress(base64.b64decode(source))
          assert hashlib.sha256(decoded).hexdigest() == "209a2cf76ef3731a7bc6d3a6845dcc580057a4e050e6890bbdc6783d4a537152", "Unexpected patch script"
          pathlib.Path(os.environ["RUNNER_TEMP"], "patch_braviaglass_1_3_5.py").write_bytes(decoded)
          PY
          python3 "$RUNNER_TEMP/patch_braviaglass_1_3_5.py" "$PROJECT_DIR"
          grep -q 'else if(ambient())openAddPicker();' "$PROJECT_DIR/app/src/main/java/com/usman/braviaglass/GlassView.java"
          grep -q 'void launchTvTimer()' "$PROJECT_DIR/app/src/main/java/com/usman/braviaglass/GlassView.java"
          grep -q "versionCode 16" "$PROJECT_DIR/app/build.gradle"
          grep -q "versionName '1.3.5'" "$PROJECT_DIR/app/build.gradle"

      - name: Fix Sony sources and layout (v1.3.6)
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch_braviaglass_1_3_6.py "$PROJECT_DIR"
          grep -q 'TvContract.buildChannelUriForPassthroughInput' "$PROJECT_DIR/app/src/main/java/com/usman/braviaglass/MainActivity.java"
          grep -q 'host.tvSettings()' "$PROJECT_DIR/app/src/main/java/com/usman/braviaglass/GlassView.java"
          grep -q "versionCode 17" "$PROJECT_DIR/app/build.gradle"
          grep -q "versionName '1.3.6'" "$PROJECT_DIR/app/build.gradle"

      - name: Apply frosted-glass UI v1.3.7
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch_braviaglass_1_3_7.py "$PROJECT_DIR"
          grep -q 'class GlassTheme' "$PROJECT_DIR/app/src/main/java/com/usman/braviaglass/GlassTheme.java"
          grep -q 'GlassTheme.popup(glass)' "$PROJECT_DIR/app/src/main/java/com/usman/braviaglass/MainActivity.java"
          grep -q 'mutedGlassTint' "$PROJECT_DIR/app/src/main/java/com/usman/braviaglass/GlassView.java"
          grep -q "versionCode 18" "$PROJECT_DIR/app/build.gradle"
          grep -q "versionName '1.3.7'" "$PROJECT_DIR/app/build.gradle"

      - name: Apply compatible Adaptive Sunset UI base (v1.3.8)
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch_braviaglass_1_3_8.py "$PROJECT_DIR"
          grep -q "versionCode 19" "$PROJECT_DIR/app/build.gradle"
          grep -q "versionName '1.3.8'" "$PROJECT_DIR/app/build.gradle"

      - name: Bundle cinematic sunset and apply premium effects v1.3.9
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PROJECT_DIR/app/src/main/assets"
          cat assets/sunset-premium-part{1,2,3,4}.b64 | base64 -d > "$PROJECT_DIR/app/src/main/assets/sunset-premium.webp"
          python3 - <<'PY'
          import hashlib, pathlib, os
          p=pathlib.Path(os.environ["PROJECT_DIR"])/"app/src/main/assets/sunset-premium.webp"
          content=p.read_bytes()
          expected="bcf8f93b9fa07183b5d67e07e6251000a3410e5d1365868a6134673ca1a5b50e"
          assert hashlib.sha256(content).hexdigest()==expected, "Bundled cinematic sunset bytes failed SHA256"
          assert content[:4]==b"RIFF" and content[8:12]==b"WEBP", "Background is not WebP"
          print("Verified cinematic sunset asset:",len(content),"bytes")
          PY
          python3 scripts/patch_braviaglass_1_3_9.py "$PROJECT_DIR"
          grep -q "versionCode 20" "$PROJECT_DIR/app/build.gradle"
          grep -q "versionName '1.3.9'" "$PROJECT_DIR/app/build.gradle"
          grep -q 'premiumReflection' "$PROJECT_DIR/app/src/main/java/com/usman/braviaglass/ColorHome.java"
          grep -q 'premiumHalo' "$PROJECT_DIR/app/src/main/java/com/usman/braviaglass/ColorHome.java"
          grep -q 'prayerGlass' "$PROJECT_DIR/app/src/main/java/com/usman/braviaglass/ColorHome.java"

      - name: Apply approved second Sunset Premium layout (v1.3.10)
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch_braviaglass_1_3_10.py "$PROJECT_DIR"
          grep -q 'void drawPremiumPrayers(Canvas c)' "$PROJECT_DIR/app/src/main/java/com/usman/braviaglass/ColorHome.java"
          grep -q 'new RectF(x,754' "$PROJECT_DIR/app/src/main/java/com/usman/braviaglass/ColorHome.java"
          grep -q 'return couch()' "$PROJECT_DIR/app/src/main/java/com/usman/braviaglass/GlassView.java"
          grep -q "versionCode 21" "$PROJECT_DIR/app/build.gradle"
          grep -q "versionName '1.3.10'" "$PROJECT_DIR/app/build.gradle"

      - name: Create five time-of-day lake scenes and enable animated pets v1.4.0
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet pillow
          python3 scripts/build_dynamic_scenes.py "$PROJECT_DIR"
          python3 scripts/patch_braviaglass_1_4_0.py "$PROJECT_DIR"
          for scene in morning noon sunset evening night; do
            test -s "$PROJECT_DIR/app/src/main/assets/dynamic-scenes/$scene.webp"
          done
          grep -q 'class PetCompanion' "$PROJECT_DIR/app/src/main/java/com/usman/braviaglass/PetCompanion.java"
          grep -q 'void petSettings()' "$PROJECT_DIR/app/src/main/java/com/usman/braviaglass/MainActivity.java"
          grep -q "versionCode 22" "$PROJECT_DIR/app/build.gradle"
          grep -q "versionName '1.4.0'" "$PROJECT_DIR/app/build.gradle"

      - name: Restore signing key from private GitHub Secrets
        shell: bash
        env:
          BRAVIA_KEYSTORE_BASE64: ${{ secrets.BRAVIA_KEYSTORE_BASE64 }}
          BRAVIA_SIGNING_PASSWORD: ${{ secrets.BRAVIA_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$BRAVIA_KEYSTORE_BASE64" || { echo 'Missing secret BRAVIA_KEYSTORE_BASE64'; exit 1; }
          test -n "$BRAVIA_SIGNING_PASSWORD" || { echo 'Missing secret BRAVIA_SIGNING_PASSWORD'; exit 1; }
          mkdir -p "$PROJECT_DIR/signing"
          printf '%s' "$BRAVIA_KEYSTORE_BASE64" | base64 -d > "$PROJECT_DIR/signing/bravia-glass.jks"
          chmod 600 "$PROJECT_DIR/signing/bravia-glass.jks"
          fingerprint="$(keytool -list -v -keystore "$PROJECT_DIR/signing/bravia-glass.jks" -storepass:env BRAVIA_SIGNING_PASSWORD -alias braviaglass | grep -m1 'SHA256:' | sed -E 's/.*SHA256:[[:space:]]*//' | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')"
          expected='6c4b04a1c738036e429da4f925d6e6440e34de71c4c7df279e020cfe08706be6'
          test "$fingerprint" = "$expected" || { echo 'Signing certificate does not match installed BraviaGlass 1.3.0'; exit 1; }
          echo 'Verified original BraviaGlass signing certificate.'

      - name: Build signed BraviaGlass v1.4.0
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          BRAVIA_SIGNING_PASSWORD: ${{ secrets.BRAVIA_SIGNING_PASSWORD }}
        run: python3 tools/build-native.py

      - name: Verify APK and generate checksum
        shell: bash
        run: |
          set -euo pipefail
          apk="$PROJECT_DIR/app/build/native-release/BraviaGlass-1.4.0.apk"
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk" | tee "$RUNNER_TEMP/apk-verify.txt"
          grep -qi '6c4b04a1c738036e429da4f925d6e6440e34de71c4c7df279e020cfe08706be6' "$RUNNER_TEMP/apk-verify.txt"
          (cd "$(dirname "$apk")" && sha256sum "$(basename "$apk")" > "$(basename "$apk").sha256")

      - name: Downloadable signed APK
        uses: actions/upload-artifact@v4
        with:
          name: BraviaGlass-1.4.0-APK
          path: |
            ${{ env.PROJECT_DIR }}/app/build/native-release/BraviaGlass-1.4.0.apk
            ${{ env.PROJECT_DIR }}/app/build/native-release/BraviaGlass-1.4.0.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish online update to GitHub Releases
        if: (github.event_name == 'workflow_dispatch' && inputs.publish_release == true) || (github.event_name == 'push' && github.event.head_commit.message == 'Publish BraviaGlass v1.4.0 as an online update')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='v1.4.0'
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to replace a published version.'
            exit 1
          fi
          dir="$PROJECT_DIR/app/build/native-release"
          gh release create "$tag" "$dir/BraviaGlass-1.4.0.apk" "$dir/BraviaGlass-1.4.0.apk.sha256" --repo "$GITHUB_REPOSITORY" --title 'BraviaGlass 1.4.0' --notes 'Sony Android TV — in-launcher updater, original BraviaGlass signing certificate, preserves existing data. Install over BraviaGlass 1.3.10. Dynamic World: five time-of-day lake scenes, automatic/optional manual background selection; small 2D and volumetric-style 3D animated pet companions, character and behaviour choices, corrected fully-visible app dock. Preserves Sony controls, Sajda, clock, menus, profiles and signature.'
